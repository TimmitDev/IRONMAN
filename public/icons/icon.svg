<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>IRONMAN Training</title>
  <defs>
    <!-- Rode gloed achter de letters -->
    <radialGradient id="glow" cx="256" cy="235" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e3122d" stop-opacity="0.38" />
      <stop offset="0.55" stop-color="#e3122d" stop-opacity="0.08" />
      <stop offset="1" stop-color="#e3122d" stop-opacity="0" />
    </radialGradient>
    <!-- Subtiel raster -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Achtergrond (volledig gevuld, dus ook bruikbaar als maskable icoon) -->
  <rect width="512" height="512" fill="#0b0b0e" />
  <rect width="512" height="512" fill="url(#grid)" />
  <rect width="512" height="512" fill="url(#glow)" />

  <!-- "IM", schuin zoals het logo; letters als vormen, geen lettertype nodig -->
  <g transform="translate(23 0) skewX(-12)">
    <rect x="150" y="168" width="62" height="152" fill="#ffffff" />
    <path d="M240 320V168h62l29 72 29-72h62v152h-52v-78l-24 58h-30l-24-58v78z" fill="#e3122d" />
  </g>

  <!-- Zwemmen, fietsen, lopen -->
  <rect x="170" y="352" width="52" height="11" rx="5.5" fill="#3987e5" />
  <rect x="230" y="352" width="52" height="11" rx="5.5" fill="#d95926" />
  <rect x="290" y="352" width="52" height="11" rx="5.5" fill="#199e70" />
</svg>
